name: deploy

# Deployment is a consequence of a green main, never a thing somebody does by hand at
# 11pm (Phase 11 step 8, re-pointed at the droplet in Phase 13 step 10).
#
# The backend runs on one droplet and builds its own image there, so there is no
# registry here and nothing to push: this workflow refuses to deploy a broken main,
# runs `deploy/deploy.sh` over SSH, checks the API came back, and tells Sentry which
# commit went out. Vercel builds both frontends from its own git integration.

# **Disarmed on purpose.** `workflow_dispatch` only, so merging to main does not deploy
# anything until the launch checks (step 9) have passed once by hand. To arm it, add:
#
#   push:
#     branches: [main]
#
# and delete this comment.
on:
  workflow_dispatch:

concurrency:
  # One deploy at a time. Two overlapping ones race on the migration job, and the loser
  # starts serving against a schema the winner has already moved.
  group: deploy-production
  cancel-in-progress: false

jobs:
  # The backend and frontend check workflows run on their own paths filters, so a commit
  # touching only one of them never runs the other. This waits for whatever did run.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Wait for checks on this commit
        uses: lewagon/wait-on-check-action@v1.4.0
        with:
          ref: ${{ github.sha }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          running-workflow-name: gate
          allowed-conclusions: success,skipped
          wait-interval: 20

  backend:
    needs: gate
    runs-on: ubuntu-latest
    environment: production
    steps:
      # `deploy.sh` does the whole deploy on the box — fetch, build, migrate against
      # the direct database port, roll the containers, wait for health. There is
      # nothing for a checkout here to add.
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: deploy
          key: ${{ secrets.DROPLET_SSH_KEY }}
          # The build on a 2 GB box takes minutes, and a timeout mid-migration is the
          # one failure mode worth spending patience to avoid.
          command_timeout: 20m
          script: /opt/champhub/deploy/deploy.sh

      # deploy.sh already waits for the loopback health check; this one goes through
      # Cloudflare and Caddy, so it also catches a certificate or proxy that broke.
      - name: Check it came back up from outside
        run: |
          for attempt in $(seq 1 10); do
            status=$(curl -s -o /dev/null -w '%{http_code}' "${{ vars.API_BASE_URL }}/api/v1/health" || true)
            if [ "$status" = "200" ]; then echo "healthy"; exit 0; fi
            echo "health check returned ${status:-nothing}, retrying"
            sleep 15
          done
          echo "The API did not come back healthy after the deploy."
          exit 1

  # Vercel deploys from its own git integration; this only records the release, so a
  # Sentry report names the commit that caused it rather than "production".
  release:
    needs: [backend]
    runs-on: ubuntu-latest
    if: ${{ vars.SENTRY_ORG != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        with:
          environment: production
          version: ${{ github.sha }}
